<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<meta name="author" content="Tomaž Berčič">
<title>Nova Gorica Open Data Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#1A6CB4;
    --slate:#3a464f;
    --ink:#ffffff;
    --ink-muted:rgba(255,255,255,0.82);
    --ink-faint:rgba(255,255,255,0.55);
    --wire:rgba(255,255,255,0.45);
    --bar-h:64px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  html{background:var(--blue)}            /* osnovna barva vedno modra, da nikoli ni "sivo" */
  body{
    margin:0;
    font-family:"Barlow",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    color:var(--ink);
    background:var(--blue);
    display:flex;flex-direction:column;min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none}
  a:hover{text-decoration:underline}

  /* HEADER */
  header{
    min-height:var(--bar-h);background:var(--slate);
    display:flex;align-items:center;justify-content:space-between;
    padding:8px clamp(20px,4vw,56px);gap:12px;flex:0 0 auto;
  }
  .brand{display:flex;flex-direction:column;justify-content:center;line-height:1.12}
  .brand-kicker{font-weight:600;letter-spacing:.09em;font-size:clamp(8px,.95vw,11px);text-transform:uppercase;color:var(--ink-muted)}
  .brand-main{font-weight:700;letter-spacing:.02em;font-size:clamp(14px,1.6vw,22px);text-transform:uppercase}
  .head-right{display:flex;align-items:center;gap:clamp(12px,2vw,30px)}
  .navlinks{display:flex;align-items:center;gap:clamp(14px,2vw,30px);font-size:clamp(13px,1.1vw,17px);font-weight:500}
  .lang-btn{
    background:transparent;color:var(--ink);border:1px solid rgba(255,255,255,.5);
    border-radius:4px;padding:5px 12px;font:600 14px/1 "Barlow",sans-serif;
    letter-spacing:.06em;cursor:pointer;
  }
  .lang-btn:hover{background:#fff;color:var(--slate)}
  .search{opacity:.7}

  /* BODY */
  main{flex:1 1 auto;padding:clamp(18px,3vw,40px) clamp(20px,4vw,56px);display:flex;flex-direction:column;gap:clamp(14px,2.2vw,26px)}
  .intro{max-width:1000px}
  .intro h1{font-weight:700;font-size:clamp(16px,1.6vw,22px);margin:0 0 8px}
  .intro p{margin:0;font-size:clamp(12px,1.05vw,15px);line-height:1.45;color:var(--ink-muted);max-height:7.5em;overflow:auto;padding-right:6px}
  .intro p::-webkit-scrollbar{width:6px}
  .intro p::-webkit-scrollbar-thumb{background:rgba(255,255,255,.3);border-radius:3px}

  /* LOCATION + TELRAAM LINK */
  .loc{display:flex;flex-direction:column;gap:4px;margin-top:4px}
  .loc-head{display:inline-flex;align-items:center;gap:12px;width:fit-content}
  .loc-head .pin{width:24px;height:24px;flex:0 0 auto}
  .loc-name{font-family:"Barlow Semi Condensed";font-weight:700;font-size:clamp(28px,4vw,52px);line-height:1;text-transform:uppercase;letter-spacing:.01em}
  .coords{font-size:clamp(12px,1.05vw,16px);color:var(--ink-muted)}
  .loc-data-link{display:inline-flex;align-items:center;gap:6px;width:fit-content;margin-top:4px;font-size:clamp(12px,1.05vw,15px);font-weight:500;color:var(--ink);border-bottom:1px solid rgba(255,255,255,.45);padding-bottom:2px}
  .loc-data-link:hover{border-bottom-color:#fff;text-decoration:none}
  .loc-data-link .ext{font-size:.9em;opacity:.8}
  .dl-link{display:inline-flex;align-items:center;gap:7px;align-self:flex-start;font-size:clamp(12px,1.05vw,15px);font-weight:600;letter-spacing:.02em;color:var(--ink);background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.45);border-radius:6px;padding:8px 15px;cursor:pointer;text-decoration:none}
  .dl-link:hover{background:#fff;color:var(--slate);border-color:#fff;text-decoration:none}

  /* DATA */
  .data{position:relative;flex:0 0 auto;display:grid;grid-template-columns:minmax(280px,1.1fr) minmax(360px,1.4fr);align-items:center;gap:clamp(20px,4vw,70px);margin-top:0}
  #wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
  .data > *{position:relative;z-index:1}

  .featured{display:flex;align-items:flex-end;gap:clamp(10px,2vw,28px)}
  .featured .col{display:flex;flex-direction:column;align-items:flex-start}
  .featured .ficon{width:34px;height:34px;margin-bottom:4px}
  .featured .big{font-family:"Barlow Semi Condensed";font-weight:600;font-size:clamp(72px,12vw,190px);line-height:.82;letter-spacing:-.01em}
  .featured .flabel{font-size:clamp(15px,1.6vw,24px);text-transform:uppercase;letter-spacing:.04em;margin-top:10px}
  .featured .fpct{font-size:clamp(15px,1.6vw,24px);font-weight:500;margin-top:2px}
  .ring{position:relative;width:clamp(110px,12vw,170px);height:clamp(110px,12vw,170px);flex:0 0 auto}
  .ring svg{transform:rotate(-90deg)}
  .ring .rtext{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(20px,2.4vw,34px);font-weight:500}

  .secondary{display:grid;grid-template-columns:repeat(3,auto);justify-content:space-between;gap:clamp(16px,3vw,48px) clamp(20px,3vw,48px);justify-items:start}
  .metric{display:flex;flex-direction:column;align-items:flex-start;min-width:120px}
  .metric .micon{width:30px;height:30px;margin-bottom:2px}
  .metric .mval{font-family:"Barlow Semi Condensed";font-weight:600;font-size:clamp(34px,4.4vw,62px);line-height:.9}
  .metric .mlabel{font-size:clamp(11px,1vw,14px);text-transform:uppercase;letter-spacing:.05em;margin-top:6px}
  .metric .mpct{font-size:clamp(11px,1vw,14px);color:var(--ink-muted);margin-top:1px}

  .period{display:inline-flex;align-items:center;gap:9px;align-self:flex-start;margin-top:4px;
    background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.4);border-radius:6px;
    padding:7px 14px;letter-spacing:.04em;text-transform:uppercase;font-size:clamp(12px,1.15vw,16px)}
  .period .pico{width:16px;height:16px;opacity:.85;flex:0 0 auto}
  .period .plabel{color:var(--ink-faint);font-weight:600}
  .period .pval{color:var(--ink);font-weight:700}
  .night-note{font-size:clamp(10px,.95vw,12px);color:var(--ink-faint);margin-top:2px}
  .windowtabs{flex-wrap:wrap;row-gap:8px;gap:clamp(10px,1.3vw,20px)}
  .wtab{font-size:clamp(11px,1.05vw,15px)!important;white-space:nowrap}
  .cmp{display:inline-flex;align-items:center;gap:4px;font-size:clamp(11px,.95vw,13px);font-weight:600;letter-spacing:.02em;margin-top:4px;padding:2px 7px;border-radius:10px;background:rgba(255,255,255,.12);white-space:nowrap}
  .cmp[hidden]{display:none}
  .cmp.up{color:#d4f7dd} .cmp.down{color:#ffd9cf} .cmp.eq{color:var(--ink-muted)}
  .featured .cmp{font-size:clamp(12px,1.1vw,15px);margin-top:8px}
  .prange{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
  .prange[hidden]{display:none}
  .pcal{display:inline-flex;align-items:center;justify-content:center;background:none;border:0;padding:3px;margin:-3px;border-radius:4px;color:inherit;cursor:pointer}
  .pcal:hover,.pcal.on{background:rgba(255,255,255,.2)}
  .pcal .pico{opacity:1}
  .prange input{font:600 13px/1 "Barlow",sans-serif;color:var(--slate);background:#fff;border:0;border-radius:4px;padding:4px 6px}
  .prange button{font:600 12px/1 "Barlow",sans-serif;letter-spacing:.04em;text-transform:uppercase;color:#fff;background:transparent;border:1px solid rgba(255,255,255,.6);border-radius:4px;padding:5px 9px;cursor:pointer}
  .prange button:hover{background:#fff;color:var(--slate)}
  .meta-note{font-size:clamp(10px,.95vw,12px);color:var(--ink-faint);margin-top:calc(4px - clamp(14px,2.2vw,26px))}
  .windowtabs{display:flex;gap:clamp(10px,1.6vw,24px);align-items:center;margin-top:clamp(6px,1.4vw,16px)}
  .wtab{background:none;border:0;padding:3px 0;cursor:pointer;color:var(--ink-faint);font:600 clamp(12px,1.2vw,16px)/1 "Barlow",sans-serif;letter-spacing:.05em;text-transform:uppercase;border-bottom:2px solid transparent}
  .wtab:hover{color:var(--ink)}
  .wtab.active{color:var(--ink);border-bottom-color:#fff}

  /* FOOTER */
  footer{background:#fff;color:var(--slate);flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:10px clamp(20px,4vw,56px);gap:14px;flex-wrap:wrap}
  .logos{display:flex;align-items:center;gap:clamp(12px,2.4vw,30px);flex-wrap:wrap}
  .logos a{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--slate);font-weight:600;letter-spacing:.02em}
  .logos .stack{display:flex;flex-direction:column;line-height:1.05}
  .logos .stack .top{font-weight:700;color:var(--ink)}
  .logos .stack .sub{font-size:9px;font-weight:500;color:var(--ink-faint);letter-spacing:.06em}
  .euflag{width:26px;height:18px;flex:0 0 auto}
  .clock{font-size:clamp(13px,1.2vw,17px);letter-spacing:.04em;color:rgba(58,70,79,.78);white-space:nowrap;margin-left:auto}

  .demo-flag{position:fixed;top:calc(var(--bar-h) + 8px);right:10px;z-index:5;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.25);border-radius:4px;padding:3px 9px;font-size:11px;letter-spacing:.04em;color:var(--ink-muted)}
  .demo-flag[hidden]{display:none}

  /* MOBILE */
  @media (max-width:880px){
    .navlinks{display:none}
    .data{grid-template-columns:1fr;gap:26px}
    #wires{display:none}
    .featured{flex-direction:column;align-items:flex-start;gap:16px}
    .featured .big{font-size:clamp(60px,19vw,96px)}
    .secondary{grid-template-columns:1fr 1fr;justify-content:start;gap:20px 28px}
    .clock{margin-left:0}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  .logo-chip{display:inline-flex;align-items:center;background:transparent;border-radius:5px;padding:0}
  .logo-chip img{display:block;height:30px;width:auto}
  .logo-word{font-size:13px;color:var(--slate);font-weight:700;letter-spacing:.02em}
  @media (max-width:880px){.logo-chip img{height:24px}}
  /* TOP ROW: EnCLOD logo levo od besedila */
  .top-row{display:grid;grid-template-columns:minmax(280px,1.1fr) minmax(360px,1.4fr);align-items:stretch;gap:clamp(20px,4vw,70px)}
  .top-col{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:clamp(10px,1.8vw,18px)}
  /* mreza zgornjega dela: zemljevid poravnan z "obdobje podatkov" */
  .top-row{grid-template-areas:"loc brand" "period map" "actions map" "tabs map";grid-template-rows:auto auto 1fr auto;column-gap:clamp(20px,4vw,70px);row-gap:clamp(10px,1.8vw,18px);align-items:start}
  .top-row .top-col,.top-row .side{display:contents}
  .top-row .loc{grid-area:loc}
  .top-row .period{grid-area:period;justify-self:start;margin-top:0}
  .top-row .actions{grid-area:actions;align-self:start}
  .top-row .brandmark{grid-area:brand;justify-self:start;align-self:start}
  .top-row .mapbox{grid-area:map;justify-self:stretch;align-self:stretch;width:auto;max-width:680px;aspect-ratio:auto;min-height:250px}
  .top-row .windowtabs{grid-area:tabs;align-self:end;margin-top:0}
  .brandmark{display:flex;align-items:center;justify-content:flex-start;background:#fff;border-radius:8px;padding:clamp(6px,.8vw,10px) clamp(10px,1.2vw,16px);width:clamp(170px,17vw,250px);box-shadow:0 8px 22px rgba(0,0,0,.22)}
  .mapbox{position:relative;width:100%;aspect-ratio:400/260;border-radius:8px;overflow:hidden;background:#155c9c;border:1px solid rgba(255,255,255,.35)}
  .mapbox[hidden]{display:none}
  .mapbox svg{display:block;position:absolute;inset:0;width:100%;height:100%}
  .mapbox .attr{position:absolute;right:6px;bottom:4px;font-size:9px;color:rgba(255,255,255,.6)}
  .mapbox .attr a{color:inherit}
  .pulse{transform-origin:center;transform-box:fill-box;animation:pulse 2.4s ease-out infinite}
  @keyframes pulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.2);opacity:0}}
  .actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .next-btn{font-family:inherit}
  .next-btn[disabled]{opacity:.5;cursor:wait}
  .authors-line{flex:0 0 auto;font-size:clamp(10px,.95vw,12px);color:var(--ink-muted);letter-spacing:.01em;padding:0 clamp(20px,4vw,56px) 8px;margin-top:calc(4px - clamp(18px,3vw,40px))}
  .authors-line b{font-weight:600;color:var(--ink)}
  @media (min-width:881px){.authors-line{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}}
  .brandmark img{display:block;width:100%;height:auto;max-height:100%;object-fit:contain}
  @media (max-width:880px){
    .top-row{grid-template-columns:1fr;grid-template-areas:"loc" "period" "actions" "brand" "map" "tabs";grid-template-rows:none;gap:16px}
    .top-row .mapbox{width:100%;max-width:none;aspect-ratio:400/260;min-height:0}
    .brandmark{width:auto;max-width:min(60vw,240px)}
  }
</style>
</head>

const MON_EN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MON_SL=["jan","feb","mar","apr","maj","jun","jul","avg","sep","okt","nov","dec"];
function fmtPeriod(a,z){
  const sl=LANG==="sl", M=sl?MON_SL:MON_EN, dot=sl?".":"";
  const d1=new Date(a), d2=new Date(z); if(isNaN(d1)||isNaN(d2)) return "—";
  const full=d=>`${d.getDate()}${dot} ${M[d.getMonth()]} ${d.getFullYear()}`;
  const spanH=(d2-d1)/36e5, sameDay=d1.getFullYear()===d2.getFullYear()&&d1.getMonth()===d2.getMonth()&&d1.getDate()===d2.getDate();
  if(spanH>0&&spanH<=6&&sameDay){ const hm=d=>String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); return `${full(d2)}, ${hm(d1)}–${hm(d2)}`; }
  if(sameDay) return full(d1);
  if(d1.getFullYear()===d2.getFullYear()&&d1.getMonth()===d2.getMonth()) return `${d1.getDate()}${dot}–${full(d2)}`;
  if(d1.getFullYear()===d2.getFullYear()) return `${d1.getDate()}${dot} ${M[d1.getMonth()]} – ${full(d2)}`;
  return `${full(d1)} – ${full(d2)}`;
}

/* Nočno okno se bere po lokalnem slovenskem času (Europe/Ljubljana, samodejno CET/CEST). */
const _LJ_HOUR = new Intl.DateTimeFormat("en-GB",{ timeZone:"Europe/Ljubljana", hour12:false, hour:"2-digit" });
function localHourLJ(d){ let h=parseInt(_LJ_HOUR.format(d),10); if(h===24) h=0; return h; }
function isNight(d){ const h=localHourLJ(d),s=CONFIG.nightStart,e=CONFIG.nightEnd; return s<e?(h>=s&&h<e):(h>=s||h<e); }
function aggregate(rows){
  const o={pedestrian:0,bike:0,car:0,heavy:0,night:0};
  for(const r of rows){
    const ped=+r.pedestrian||0,bike=+r.bike||0,car=+r.car||0,heavy=+r.heavy||0;
    o.pedestrian+=ped;o.bike+=bike;o.car+=car;o.heavy+=heavy;
    const d=new Date(r.date); if(!isNaN(d)&&isNight(d)) o.night+=ped+bike+car+heavy;
  }
  Object.keys(o).forEach(k=>o[k]=Math.round(o[k])); return o;
}
function periodFromRows(rows,fs,fe){
  let lo=Infinity,hi=-Infinity;
  for(const r of rows){const ts=Date.parse(r.date); if(!isNaN(ts)){if(ts<lo)lo=ts; if(ts>hi)hi=ts;}}
  return isFinite(lo)?{start:new Date(lo),end:new Date(hi)}:{start:fs,end:fe};
}
async function fetchLive(sensor){
  const w=state.window||"hour", end=new Date();
  const lookbackMs = w==="hour" ? (CONFIG.lookbackHours||6)*36e5 : w==="day" ? 24*36e5 : 7*864e5;
  const start=new Date(end.getTime()-lookbackMs);
  const fmt=d=>d.toISOString().slice(0,19).replace("T"," ")+"Z";
  const body={ id:sensor.segmentId, time_start:fmt(start), time_end:fmt(end), level:"segments", format:CONFIG.reportFormat };
  const res=await fetch(CONFIG.proxyUrl,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!res.ok) throw new Error("proxy "+res.status);
  const json=await res.json(); const rows=json.report||json||[];
  if(!Array.isArray(rows)||!rows.length) throw new Error("empty report");
  if(w==="hour"){ const r=latestRow(rows); return { data:aggregate([r]), period:hourWindow(r) }; }
  return { data:aggregate(rows), period:periodFromRows(rows,start,end) };
}
function latestRow(rows){ let best=rows[0],bt=-Infinity; for(const r of rows){const t=Date.parse(r.date); if(!isNaN(t)&&t>=bt){bt=t;best=r;}} return best; }
function hourWindow(r){ const s=new Date(r.date); return {start:s,end:new Date(s.getTime()+36e5),hour:true}; }
function demoWindow(){
  const w=state.window||"hour";
  if(w==="hour"){ const e=new Date(); e.setMinutes(0,0,0); return { start:new Date(e.getTime()-36e5), end:e, hour:true }; }
  const end=new Date(); end.setHours(0,0,0,0);
  return { start:new Date(end.getTime()-(w==="day"?1:w==="month"?30:7)*864e5), end };
}
async function fetchStatic(sensor){
  const res=await fetch(CONFIG.dataUrl+sensor.segmentId+".json?v="+Math.floor(Date.now()/6e5),{cache:"no-cache"});
  if(!res.ok) throw new Error("static "+res.status);
  const j=await res.json();
  const all=(j.rows||[]).filter(r=>!isNaN(Date.parse(r.date)));
  if(!all.length) throw new Error("empty report");
  const w=state.window||"hour";
  if(w==="hour"){ const r=latestRow(all); return { data:aggregate([r]), period:hourWindow(r), row:r }; }
  const end=Date.now(), span=(w==="day"?1:7)*864e5;
  const rows=all.filter(r=>Date.parse(r.date)>end-span);
  if(!rows.length) throw new Error("no rows in window");
  return { data:aggregate(rows), period:periodFromRows(rows,new Date(end-span),new Date(end)) };
}

const ljDay=d=>_LJ_DATE.format(d);
const dayDate=k=>new Date(k+"T12:00:00");
const addDays=(k,n)=>{ const d=dayDate(k); d.setDate(d.getDate()+n); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
async function loadDaily(sensor){
  const id=sensor.segmentId;
  if(DAILY[id]===undefined){
    try{ const r=await fetch(CONFIG.dataUrl+id+"_daily.json?v="+Math.floor(Date.now()/6e5),{cache:"no-cache"});
      if(r.ok){ const j=await r.json(); const map={}; (j.days||[]).forEach(d=>map[d[0]]=d); DAILY[id]={days:j.days||[],map,profile:j.profile||{}}; } else DAILY[id]=null;
    }catch(e){ DAILY[id]=null; }
  }
  return DAILY[id];
}
const sumDays=(dl,from,to)=>{ const o={pedestrian:0,bike:0,car:0,heavy:0}; let n=0; for(let k=from;k<=to;k=addDays(k,1)){ const d=dl.map[k]; if(d&&d[5]>0){ o.pedestrian+=d[1]; o.bike+=d[2]; o.car+=d[3]; o.heavy+=d[4]; n++; } } return {o,n}; };
const meanOf=list=>{ if(!list.length) return null; const o={pedestrian:0,bike:0,car:0,heavy:0}; list.forEach(x=>{ for(const k in o) o[k]+=x[k]; }); for(const k in o) o[k]/=list.length; return o; };
function lastFullDay(dl){ const today=ljDay(new Date()); for(let i=dl.days.length-1;i>=0;i--){ const d=dl.days[i]; if(d[0]<today&&d[5]>0) return d[0]; } return null; }
function dailyWindow(dl,w){
  const L=lastFullDay(dl); if(!L) throw new Error("no daily data");
  const len=w==="day"?1:w==="week"?7:30, from=addDays(L,-(len-1));
  const cur=sumDays(dl,from,L); if(!cur.n) throw new Error("no data in window");
  const blocks=[], nb=w==="month"?6:8, step=w==="day"?7:len, minN=Math.ceil(len*0.8);
  for(let b=1;b<=nb;b++){ const f=addDays(from,-step*b), t2=addDays(L,-step*b); const x=sumDays(dl,f,t2); if(x.n>=minN) blocks.push(x.o); }
  return { data:cur.o, period:{start:dayDate(from),end:dayDate(L)}, base:meanOf(blocks), cmp:"cmp_"+w };
}
async function getData(sensor){
  if(CONFIG.mode==="static"){
    try{
      const w=state.window||"month";
      if(w==="hour"){
        const r=await fetchStatic(sensor), dl=await loadDaily(sensor);
        let base=null;
        if(dl&&r.row){ const d=new Date(r.row.date), k=WD[_LJ_WD.format(d)]+"-"+localHourLJ(d), p=dl.profile[k]; if(p) base={pedestrian:p[0],bike:p[1],car:p[2],heavy:p[3]}; }
        return {data:r.data,live:true,period:r.period,base,cmp:"cmp_hour"};
      }
      const dl=await loadDaily(sensor); if(!dl) throw new Error("no daily file");
      if(w==="custom"){
        const f=state.range&&state.range.from, to=state.range&&state.range.to;
        if(!f||!to) throw new Error("no range");
        const a=f<=to?f:to, z=f<=to?to:f, x=sumDays(dl,a,z); if(!x.n) throw new Error("no data in range");
        return {data:x.o,live:true,period:{start:dayDate(a),end:dayDate(z)},base:null,cmp:"cmp_custom"};
      }
      const r=dailyWindow(dl,w); return {data:r.data,live:true,period:r.period,base:r.base,cmp:r.cmp};
    }catch(e){ console.warn("Staticni podatki niso na voljo, demo:",e.message); }
  }
  if(CONFIG.mode==="live"&&CONFIG.proxyUrl){
    try{ const r=await fetchLive(sensor); return {data:r.data,live:true,period:r.period}; }
    catch(e){ console.warn("Live klic ni uspel, demo:",e.message); }
  }
  return {data:{...sensor.demo},live:false,period:(sensor.demoPeriod||demoWindow())};
}

/* ---------- IZRIS ---------- */
const C=2*Math.PI*44;
const nf=new Intl.NumberFormat("en-US",{useGrouping:false});
const state={sensor:null,featuredKey:null,data:null,window:"month"};

function shareDenom(d){ return CONFIG.shareMode==="modal"?(d.pedestrian+d.bike+d.car+d.heavy):(d.pedestrian+d.bike+d.car+d.heavy+d.night); }
function pct(v,den){ return den>0?(v/den*100):0; }
function cmpHtml(key){
  const b=state.base, v=state.data&&state.data[key];
  if(!b||!(b[key]>=3)||v==null) return "";   /* premajhno povprecje = prevec suma */
  const d=(v-b[key])/b[key]*100, cls=Math.abs(d)<5?"eq":(d>0?"up":"down");
  const arrow=cls==="eq"?"≈":(cls==="up"?"▲":"▼"), txt=cls==="eq"?t("cmp_eq"):(Math.abs(d).toFixed(0)+" % "+t(cls==="up"?"cmp_up":"cmp_down"));
  return '<span class="cmp '+cls+'" title="'+t(state.cmp||"cmp_week")+'">'+arrow+" "+txt+'</span>';
}

function render(){
  const {sensor,data,featuredKey}=state; if(!sensor||!data) return;
  document.getElementById("loc-name").textContent=sensor.name;
  document.getElementById("loc-coords").textContent=sensor.address||((sensor.lat!=null&&sensor.lon!=null)?(sensor.lat+", "+sensor.lon):"");
  document.getElementById("loc-link").href=sensor.telraamUrl||"#";
  document.getElementById("loc-data-link").href=sensor.telraamUrl||"#";
  (function(){var _dl=document.getElementById("dl-link"); if(CONFIG.mode==="static"){ _dl.href=CONFIG.dataUrl+encodeURIComponent(sensor.segmentId)+".csv"; _dl.setAttribute("download","telraam_"+sensor.segmentId+".csv"); _dl.removeAttribute("target"); } else if(CONFIG.proxyUrl){ _dl.href=CONFIG.proxyUrl+(CONFIG.proxyUrl.indexOf("?")>=0?"&":"?")+"csv=1&id="+encodeURIComponent(sensor.segmentId); _dl.setAttribute("download",""); _dl.removeAttribute("target"); } else { _dl.href=sensor.telraamUrl||"#"; _dl.removeAttribute("download"); _dl.setAttribute("target","_blank"); _dl.setAttribute("rel","noopener"); } })();

  const den=shareDenom(data);
  const fVal=data[featuredKey]||0, fPct=pct(fVal,den);
  document.getElementById("f-icon").innerHTML=ICONS[METRICS.find(m=>m.key===featuredKey).icon];
  document.getElementById("f-val").textContent=nf.format(fVal);
  document.getElementById("f-label").textContent=t("m_"+featuredKey);
  document.getElementById("f-pct").textContent=fPct.toFixed(2)+"%";
  (function(){ const c=document.getElementById("f-cmp"), h=cmpHtml(featuredKey); if(h){ const tmp=document.createElement("div"); tmp.innerHTML=h; const n=tmp.firstChild; c.className=n.className; c.title=n.title; c.textContent=n.textContent; c.hidden=false; } else c.hidden=true; })();

  const off=C*(1-Math.min(fPct,100)/100), arc=document.getElementById("ring-arc");
  arc.style.transition="none"; arc.setAttribute("stroke-dashoffset",C);
  requestAnimationFrame(()=>{arc.style.transition="stroke-dashoffset .9s ease"; arc.setAttribute("stroke-dashoffset",off);});
  document.getElementById("ring-text").textContent=fPct.toFixed(2)+"%";

  const others=METRICS.filter(m=>m.key!==featuredKey), grid=document.getElementById("secondary");
  grid.innerHTML="";
  others.forEach((m,i)=>{
    const v=data[m.key]||0, el=document.createElement("div");
    el.className="metric"; el.dataset.slot=i;
    el.innerHTML='<span class="micon">'+ICONS[m.icon]+'</span><span class="mval">'+nf.format(v)+'</span><span class="mlabel">'+t("m_"+m.key)+'</span><span class="mpct">'+pct(v,den).toFixed(2)+'%</span>'+cmpHtml(m.key);
    grid.appendChild(el);
  });
  layoutWires();
}

function layoutWires(){
  const svg=document.getElementById("wires"), host=document.querySelector(".data");
  if(!svg||!host||host.offsetWidth===0) return;
  const b=host.getBoundingClientRect(); svg.setAttribute("viewBox","0 0 "+b.width+" "+b.height);
  const left=el=>{const r=el.getBoundingClientRect();return{x:r.left-b.left,y:r.top-b.top+r.height/2};};
  const right=el=>{const r=el.getBoundingClientRect();return{x:r.right-b.left,y:r.top-b.top+r.height/2};};
  const feat=document.querySelector(".featured"), slots=[...document.querySelectorAll(".metric")];
  if(slots.length<3||getComputedStyle(svg).display==="none"){svg.innerHTML="";return;}
  const fp=right(feat), s=slots.map(left), sr=slots.map(right);
  const curve=(a,z)=>{const mx=(a.x+z.x)/2;return`M ${a.x} ${a.y} C ${mx} ${a.y}, ${mx} ${z.y}, ${z.x} ${z.y}`;};
  svg.innerHTML=[curve(fp,s[0]),curve(sr[0],s[1]),curve(sr[1],s[2])]
    .map(d=>`<path d="${d}" fill="none" stroke="var(--wire)" stroke-width="1.4"/>`).join("");
}

/* ---------- JEZIK ---------- */
function applyLang(){
  document.documentElement.lang = (LANG==="sl"?"sl":"en");
  document.getElementById("brand-kicker").textContent=t("brand_kicker")+(CONFIG.testBadge?" · "+t("test_badge"):"");
  document.getElementById("brand").textContent=t("brand");
  document.querySelector('[data-link="projects"]').textContent=t("nav_projects");
  document.querySelector('[data-link="contacts"]').textContent=t("nav_contacts");
  document.getElementById("intro-h").textContent=t("intro_h");
  document.getElementById("intro-p").textContent=t("intro_p");
  document.getElementById("loc-link-label").textContent=t("loc_link");
  document.getElementById("night-note").textContent=state.base?t(state.cmp||"cmp_week"):(state.window==="custom"?t("cmp_custom"):t("cmp_none"));
  document.getElementById("d-apply").textContent=t("range_apply");
  document.getElementById("pcal").title=t("pick_range"); document.getElementById("pcal").setAttribute("aria-label",t("pick_range"));
  document.getElementById("pcal").classList.toggle("on",state.window==="custom");
  document.getElementById("range-to").textContent=t("range_to");
  document.getElementById("prange").hidden=state.window!=="custom";
  document.getElementById("period-val").hidden=state.window==="custom";
  document.getElementById("meta-note").textContent=t("source_note")+" · "+t("rotate_note");
  document.getElementById("dl-link").textContent=t("dl_link");
  document.getElementById("authors").innerHTML=t("authors");
  document.getElementById("next-btn").textContent=t("next_btn");
  document.getElementById("period-label").textContent=t("period_label");
  document.getElementById("period-val").textContent=state.period?fmtPeriod(state.period.start,state.period.end):"—";
  document.getElementById("demo-flag").textContent=t("demo");
  document.getElementById("lang-btn").textContent=t("lang_other");   // en gumb: prikaže CILJNI jezik
  document.querySelectorAll(".wtab").forEach(el=>{ el.textContent=t("win_"+el.dataset.window); el.classList.toggle("active", el.dataset.window===(state.window||"month")); });
  render();
}
function setLang(l){ LANG=l; try{localStorage.setItem("ngodd_lang",l);}catch(e){} applyLang(); }
function applyResult(r){ state.data=r.data; state.period=r.period; state.base=r.base||null; state.cmp=r.cmp||null; document.getElementById("demo-flag").hidden=r.live; }
async function setupRange(){
  const dl=await loadDaily(state.sensor), fi=document.getElementById("d-from"), ti=document.getElementById("d-to");
  if(dl&&dl.days.length){ fi.min=ti.min=dl.days[0][0]; fi.max=ti.max=dl.days[dl.days.length-1][0]; }
  if(!state.range){ const L=(dl&&lastFullDay(dl))||ljDay(new Date()); state.range={from:addDays(L,-13),to:L}; }
  fi.value=state.range.from; ti.value=state.range.to;
}
async function refresh(){ try{ applyResult(await getData(state.sensor)); }catch(e){ console.warn(e); } applyLang(); }
async function setWindow(w){
  if(state.window===w) return;
  state.window=w;
  document.querySelectorAll(".wtab").forEach(el=>el.classList.toggle("active", el.dataset.window===w));
  if(w==="custom") await setupRange();
  await refresh();
}

/* ---------- ZEMLJEVID LOKACIJE ---------- */
const MAPS={};
const MAP_W={major:3.2,mid:2.3,minor:1.4,service:.8}, MAP_O={major:.95,mid:.85,minor:.68,service:.42};
async function loadMap(){
  const s=state.sensor, box=document.getElementById("mapbox"); if(!s||!box) return;
  let m=MAPS[s.segmentId];
  if(m===undefined){
    try{ const r=await fetch(CONFIG.dataUrl+"map_"+s.segmentId+".json?v="+Math.floor(Date.now()/864e5)); m=r.ok?await r.json():null; }catch(e){ m=null; }
    MAPS[s.segmentId]=m;
  }
  if(state.sensor!==s) return;
  if(!m||!m.streets){ box.hidden=true; box.innerHTML=""; return; }
  let g='<svg viewBox="0 0 '+m.w+' '+m.h+'" preserveAspectRatio="xMidYMid slice" role="img" aria-label="'+t("map_label")+'">';
  if(m.buildings) g+='<path d="'+m.buildings+'" fill="#fff" fill-opacity=".17" stroke="#fff" stroke-opacity=".28" stroke-width=".5"/>';
  ["service","minor","mid","major"].forEach(c=>{ if(m.streets[c]) g+='<path d="'+m.streets[c]+'" fill="none" stroke="#fff" stroke-opacity="'+MAP_O[c]+'" stroke-width="'+MAP_W[c]+'" stroke-linecap="round" stroke-linejoin="round"/>'; });
  if(m.seg){ g+='<path d="'+m.seg+'" fill="none" stroke="#0b3c69" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" stroke-opacity=".55"/>'
             +'<path d="'+m.seg+'" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>'; }
  const x=m.pt[0], y=m.pt[1];
  g+='<circle class="pulse" cx="'+x+'" cy="'+y+'" r="10" fill="none" stroke="#fff" stroke-width="2"/>'
    +'<circle cx="'+x+'" cy="'+y+'" r="6.5" fill="#fff" stroke="#0b3c69" stroke-width="2.5"/>';
  const esc=v=>String(v).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  (m.labels||[]).forEach(l=>{ g+='<text x="'+l.x+'" y="'+l.y+'" transform="rotate('+l.a+' '+l.x+' '+l.y+')" text-anchor="middle" dominant-baseline="central" font-family="Barlow, sans-serif" font-size="9.5" font-weight="600" letter-spacing=".3" fill="#fff" stroke="#155c9c" stroke-width="3" paint-order="stroke" stroke-linejoin="round">'+esc(l.t)+'</text>'; });
  g+='</svg>';
  g+='<span class="attr">© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a></span>';
  box.innerHTML=g; box.hidden=false;
}
async function nextSensor(){
  const btn=document.getElementById("next-btn"); btn.disabled=true;
  const n=SENSORS.length;
  for(let i=1;i<=n;i++){
    const j=(state.idx+i)%n, s=SENSORS[j];
    const r=await getData(s);
    if(r.live||CONFIG.mode!=="static"){
      state.idx=j; state.sensor=s; applyResult(r);
      break;
    }
  }
  btn.disabled=false;
  applyLang(); loadMap();
}

/* ---------- URA (02-JUN-2026 19:30) ---------- */
const MON=["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
function tickClock(){const d=new Date(),p=n=>String(n).padStart(2,"0");
  document.getElementById("clock").textContent=`${p(d.getDate())}-${MON[d.getMonth()]}-${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;}

/* ---------- ZAGON ---------- */
async function init(){
  try{ const sv=localStorage.getItem("ngodd_lang"); if(sv==="sl"||sv==="en") LANG=sv; }catch(e){}
  tickClock(); setInterval(tickClock,15000);
  window.addEventListener("resize",layoutWires);
  document.getElementById("lang-btn").addEventListener("click",()=>setLang(LANG==="sl"?"en":"sl"));
  document.querySelectorAll(".wtab").forEach(el=>el.addEventListener("click",()=>setWindow(el.dataset.window)));
  document.getElementById("next-btn").addEventListener("click",nextSensor);
  document.getElementById("pcal").addEventListener("click",()=>{ if(state.window==="custom") setWindow(state.prevWindow||"month"); else { state.prevWindow=state.window; setWindow("custom"); } });
  document.getElementById("d-apply").addEventListener("click",async()=>{ const f=document.getElementById("d-from").value, to=document.getElementById("d-to").value; if(f&&to){ state.range={from:f,to}; await refresh(); } });

  const idx=loadIndex();
  state.idx=idx%SENSORS.length;
  state.sensor=SENSORS[state.idx];
  state.featuredKey=CONFIG.rotateFeaturedMetric?METRICS[idx%METRICS.length].key:METRICS[0].key;

  let res=await getData(state.sensor);
  /* staticni nacin: ce izbrani senzor nima podatkov, poisci naslednjega, ki jih ima */
  if(CONFIG.mode==="static"&&!res.live){
    for(let k=1;k<SENSORS.length&&!res.live;k++){
      const s=SENSORS[(idx+k)%SENSORS.length], r=await getData(s);
      if(r.live){ state.sensor=s; state.idx=(idx+k)%SENSORS.length; res=r; }
    }
  }
  applyResult(res);
  applyLang();
  loadMap();
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(layoutWires);
  setTimeout(layoutWires,400);
}
document.addEventListener("DOMContentLoaded",init);
</script>
